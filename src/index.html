<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Task Manager</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="style/bootstrap.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.5.0/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style/responsive.css">
  <link rel="stylesheet" href="style/teststyle.css">
</head>

<body>
  <section class="experience_section layout_padding">
    <div class="container">
      <div class="row">
            <div class="headerContainer">
              <h2 class="title">Daily Tasks</h2>
              <p class="date">21/01/2024</p>
            </div>
            <div class="tableContainer">
              <div id="task-list" class="task-list">
                <div class="task-item">
                  <p class="">Uma task</p>
                  <span class="status-icon">
                    <i class="bi bi-x-circle-fill"></i>
                  </span>
              </div>
              </div>
            </div>
            <div class="input-wrapper">
              <select id="DayTypeDropdown"></select>
              <input type="text" id="taskInput" placeholder="Enter a new task...">
              <button onclick="addTask()" class="submit-btn"><i class="bi bi-arrow-right-circle-fill"></i></button>
            </div>
        
      </div>
    </div>
  </section>

  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="js/bootstrap.js"></script>
  <script src="js/custom.js"></script>
  <script src="js/Task.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
