<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Task Manager</title>
  <link rel="stylesheet" href="style/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <link rel="stylesheet" href="style/responsive.css">
  <link rel="stylesheet" href="style/teststyle.css">
</head>

<body>
  <section class="experience_section layout_padding">
    <div class="container">
      <div class="row">
            <div class="headerContainer">
              <h2 class="title">Daily Tasks</h2>
              <p class="date" id="dateDisplay">21/01/2024</p>
              <button class="btn extract-button" type="button" id="extractButton">
                  <p>Send to excel</p>
              </button>
            </div>
            <div class="tableContainer">
              <div id="task-list" class="task-list">
              </div>
            </div>
            <div class="input-wrapper">
                <div class="dropdown">
                  <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    <i id="iconContainer" class="fas fa-umbrella-beach"> </i>
                  </button>
                  <div class="dropdown-menu" aria-labelledby="dropdownMenuButton" id="dropdownOptions">
                  </div>
                </div>
              <input type="text" id="taskInput" placeholder="Enter a new task...">
              <button onclick="addTask()" class="submit-btn"><i class="fa fa-arrow-circle-right"></i></button>
            </div>
        
      </div>
    </div>
  </section>

<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>


  <script src="js/custom.js"></script>
  <script src="js/Task.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
