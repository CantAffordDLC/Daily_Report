<div class="shell">
  <header class="topbar">
    <span class="brand">Daily Report</span>
    <nav class="nav">
      <a routerLink="/projects" routerLinkActive="active">Projects</a>
      <a routerLink="/hours" routerLinkActive="active">Hours</a>
      <a routerLink="/hour-logs" routerLinkActive="active">Hour logs</a>
      <a routerLink="/reports" routerLinkActive="active">Reports</a>
      <button type="button" class="nav-btn" (click)="openSettings()">⚙ Settings</button>
    </nav>
  </header>
  <main class="main">
    <router-outlet />
  </main>
</div>

<app-reminder-popup
  [open]="reminderOpen"
  (closed)="onReminderClosed()"
  (saved)="onReminderClosed()"
/>

<app-settings-dialog
  [open]="settingsOpen"
  (closed)="closeSettings()"
/>
